<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>{{ t.app_name }}</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/?lang={{ lang }}" aria-label="{{ t.app_name }}">
      <span class="brand-mark">N</span>
      <span><strong>NARXOZ</strong><small>Master’s Dissertation Beta</small></span>
    </a>
    <nav class="languages" aria-label="Language">
      {% for code, label in languages.items() %}
        <a href="{{ request.url.path }}?lang={{ code }}" class="{% if code == lang %}active{% endif %}">{{ label }}</a>
      {% endfor %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>{{ t.footer }}</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
